name: Flo Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./flo-backend

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests with Pytest
      env:
        # Pass dummy environment variables for tests to succeed
        DATABASE_URL: sqlite:///:memory:
        SECRET_KEY: test_secret_key
        # GEMINI_API_KEY is not strictly required for tests since they mock/fallback, 
        # but you can add it as a GitHub Secret later if needed.
      run: |
        pytest -v
